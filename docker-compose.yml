# Fixed project name: volumes/network become agent-workbench_*, so it does not touch other Compose projects on the machine.
name: agent-workbench

services:
  # ── Agent Server: FastAPI API + Web UI (http://localhost:8000, change the port with HOST_PORT) ──
  agent-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      # Reachable from this machine only. The server runs code written by a model and has no auth,
      # so it is NOT exposed to the LAN. To demo to another machine on purpose: BIND_ADDRESS=0.0.0.0 in .env (at your own risk).
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8000}:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-db:/data/db          # SQLite history (only the server sees it)
      - agent-runs:/data/runs      # code + artifacts of each run (shared with the sandbox)
    environment:
      # Read from the shell or the .env file next to this file; only the backend has the keys.
      # If a provider has no key, only that provider is unavailable.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # Ollama runs on the host machine: inside the container "localhost" is the container itself,
      # so the default points to host.docker.internal. Override it with OLLAMA_BASE_URL in .env if Ollama is elsewhere.
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - USE_DOCKER=true
      - SANDBOX_MODE=persistent
      - SANDBOX_CONTAINER_NAME=agent-workbench-sandbox
      - SANDBOX_RUNS_DIR=/workspace/runs
      - MAX_ITERATIONS=${MAX_ITERATIONS:-5}
      - EXECUTION_TIMEOUT=${EXECUTION_TIMEOUT:-30}
      - DB_PATH=/data/db/agent.db
      - RUNS_DIR=/data/runs
    extra_hosts:
      # Docker Desktop already provides this name; this line makes it work on Docker Engine under Linux/WSL too
      - "host.docker.internal:host-gateway"
    depends_on:
      sandbox:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Sandbox (always running; the server runs code with docker exec) ──
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: agent-workbench-sandbox:latest
    container_name: agent-workbench-sandbox
    # Keep the container alive for debugging: docker exec -it agent-workbench-sandbox bash
    command: tail -f /dev/null
    volumes:
      # Hybrid mode (server runs as Python on the host): SANDBOX_RUNS_MOUNT=./data/runs
      - ${SANDBOX_RUNS_MOUNT:-agent-runs}:/workspace/runs
    mem_limit: 512m
    cpus: 1.0
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    restart: unless-stopped
    # Network is on for auto pip install; for full isolation: network_mode: none

volumes:
  agent-db:
  agent-runs:
